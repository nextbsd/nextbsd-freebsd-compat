name: Build NextBSD Base (buildworld)
on:
  repository_dispatch:
    types: [toolchain-updated]
  pull_request:
    # Validate the from-source base build (both arches) on PRs touching the strip
    # scripts or the workflow. PR runs never cascade — the downstream nextbsd ISO
    # dispatch is gated on github.ref == 'refs/heads/main'.
    paths: ['scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''

env:
  FREEBSD_BRANCH: releng/15.1
  # Full FreeBSD world, EXTERNAL ports-llvm19 toolchain via --cross-bindir: NO base
  # compiler is built or installed (WITHOUT_TOOLCHAIN gates cross-tools clang/lld
  # off; the external clang compiles the world). No tests/lib32/man/debug in the
  # base. krb5 is explicitly enabled — FreeBSD 15 defaults MK_KERBEROS=no, but the
  # consumer needs libkrb5/GSSAPI (sshd GSSAPI, curl/git).
  WORLD_FLAGS: >-
    WITHOUT_TOOLCHAIN=yes WITHOUT_TESTS=yes WITHOUT_LIB32=yes WITHOUT_MAN=yes
    WITHOUT_DEBUG_FILES=yes MK_KERBEROS=yes MK_KERBEROS_SUPPORT=yes
    MK_MITKRB5=yes MK_GSSAPI=yes

jobs:
  base:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    container:
      # Per-arch toolchain image (the same one the kernel/modules builds use).
      # Both arches cross-build on the x86_64 runner — clang cross-compiles, no
      # emulation. The toolchain repo publishes both amd64-* and arm64-* tags.
      image: ghcr.io/nextbsd-redux/nextbsd-kernel-toolchain:${{ matrix.target }}-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      # Full buildworld with the external ports-llvm19 compiler. buildworld runs
      # its own _bootstrap-tools/_legacy (host sh/awk/m4/yacc/mtree/makefs — not a
      # compiler) and _includes/_libraries/everything internally, so the old
      # explicit toolchain/_includes warm-up is gone.
      - name: buildworld (external ports llvm19)
        run: |
          cd /usr/src
          # Lever B (#278): bake rtld-elf's compiled-in default search path so
          # ports/pkg binaries AND NextBSD's GNUstep daemons resolve libs with no
          # hints file (covers setuid, which ignore LD_* / hints). make.conf so
          # CFLAGS+= APPENDS to rtld's Makefile flags (a make-cmdline CFLAGS+=
          # would drop rtld's own -I -> "debug.h not found"). Must precede buildworld.
          printf '%s\n' \
            '.if ${.CURDIR:M*/libexec/rtld-elf}' \
            'CFLAGS+= -DSTANDARD_LIBRARY_PATH=\"/lib:/usr/lib:/usr/lib/system:/System/Library/Libraries:/usr/local/lib\"' \
            '.endif' >> /etc/make.conf
          ./tools/build/make.py --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} ${WORLD_FLAGS} \
            -j"$(nproc)" buildworld

      # installworld (NOT `make distribution`) into /stage. distribution is the
      # only target that populates /etc + /var CONTENT — we never run it, so the
      # base ships no config; installworld/distrib-dirs leave only an empty
      # skeleton, stripped in Pack. NO_ROOT + DB_FROM_SRC reproduce the curated
      # build's unprivileged Linux-runner semantics (metalog mode, no chown; root/
      # wheel resolved from the src tree master.passwd) for the WHOLE world.
      - name: installworld into /stage
        run: |
          cd /usr/src
          mkdir -p /stage
          set -- --cross-bindir="${CROSS_BINDIR}" \
                 TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} \
                 ${WORLD_FLAGS}
          ./tools/build/make.py "$@" distrib-dirs \
            DESTDIR=/stage NO_ROOT=1 DB_FROM_SRC=1 METALOG=/stage/METALOG
          ./tools/build/make.py "$@" installworld \
            DESTDIR=/stage NO_ROOT=1 DB_FROM_SRC=1 METALOG=/stage/METALOG

      # Delete FreeBSD base tools NextBSD replaces with its own implementation
      # (init->launchd, kld*->kext*/kextd, devd/devmatch->IOKit, bsd{config,install}
      # ->nextbsd-installer, freebsd-update->pkg). Each listed path is existence-
      # asserted: a stale entry fails the build so the list gets pruned.
      - name: Strip superseded base tools
        run: STAGE=/stage bash "$GITHUB_WORKSPACE/scripts/strip-superseded.sh"

      # Remove every path NextBSD-userland (Apple/Darwin overlay) also ships, so
      # the overlay owns the canonical copy (pkg forbids two owners). Self-policing:
      # any base<->userland overlap NOT in scripts/collisions FAILS the build.
      - name: Strip base<->userland collisions (self-policing)
        run: STAGE=/stage ARCH=${{ matrix.target }} bash "$GITHUB_WORKSPACE/scripts/strip-collisions.sh"

      - name: Inspect /stage
        run: |
          echo "=== libc / rtld present? ==="
          ls -l /stage/lib/libc.so* /stage/libexec/ld-elf.so.1 2>&1 || true
          echo "=== top-level dirs ==="; find /stage -maxdepth 2 -type d | sort

      - name: Pack base artifact
        run: |
          STAGE=/stage
          # Re-apply setuid/setgid from METALOG (#334). Unprivileged install records
          # the mode but can't set the bit; we tar raw /stage (no makefs -M). Drive
          # the WHOLE world from the manifest (su, login, passwd, crontab, ping,
          # traceroute, chsh, ...), not the old hardcoded 3-file list.
          if [ -f "$STAGE/METALOG" ]; then
            awk '{ m="";
                   for (i=1;i<=NF;i++) if ($i ~ /^mode=/) { m=$i; sub(/^mode=/,"",m) }
                   if (m ~ /^0?[2-7][0-7][0-7][0-7]$/) { p=$1; sub(/^\.\//,"",p); print m, p } }' \
                "$STAGE/METALOG" \
            | while read -r mode rel; do [ -e "$STAGE/$rel" ] && chmod "$mode" "$STAGE/$rel" || true; done
          fi
          rm -f "$STAGE/METALOG"
          # HARD GUARD: nextbsd/overlays own /etc and /var. Strip the empty skeleton
          # + boot/kernel (kernel is nextbsd's), then ASSERT /etc and /var are gone.
          rm -rf "$STAGE"/etc "$STAGE"/var "$STAGE"/root "$STAGE"/.profile "$STAGE"/.cshrc
          rm -rf "$STAGE"/boot/kernel
          if [ -e "$STAGE/etc" ] || [ -e "$STAGE/var" ]; then
            echo "::error::/etc or /var still present after strip — nextbsd must own these"; exit 1
          fi
          echo "=== final base tree (top levels) ==="; find "$STAGE" -maxdepth 2 -type d | sort
          tar -C "$STAGE" -czf /tmp/nextbsd-base-${{ matrix.target }}.tar.gz .

      - name: Upload base artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextbsd-base-${{ matrix.target }}
          path: /tmp/nextbsd-base-${{ matrix.target }}.tar.gz

  # Refresh the rolling `continuous` release from a successful main build and then
  # cascade to the nextbsd ISO — unchanged from the curated pipeline. Artifact
  # name/layout are identical, so nextbsd-pkg is unaffected. PRs build but never
  # reach here (gated on refs/heads/main).
  publish:
    name: publish continuous
    needs: base
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect per-arch assets
        run: |
          mkdir -p out
          find artifacts -name 'nextbsd-base-*.tar.gz' -exec cp {} out/ \;
          ls -lh out/

      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous base build
          body: |
            Rolling from-source base (full buildworld), refreshed on every
            successful `main` build. Consumed by nextbsd
            (`nextbsd-base-<arch>.tar.gz`).

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz

      - name: Trigger downstream nextbsd ISO build
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api repos/nextbsd-redux/nextbsd/dispatches \
            -f event_type=base-updated \
            -f "client_payload[fbsd_sha]=${{ github.event.client_payload.fbsd_sha || inputs.fbsd_sha }}"
